<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Aryan's Assistant</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1DB954;
            --background-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333;
            --text-muted-color: #ccc;
            --card-color: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 62.5%; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 2.8rem;
        }
        .chat-area {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #chat-box {
            flex-grow: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .user-msg, .bot-msg {
            padding: 10px 15px;
            border-radius: 12px;
            line-height: 1.5;
            max-width: 85%;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-msg { background-color: #2a2a2a; align-self: flex-end; }
        .bot-msg { background-color: var(--primary-color); color: #111; align-self: flex-start; font-weight: 500;}
        
        .questions-title {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--text-muted-color);
            text-align: center;
        }
        .question-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .question-btn {
            background: var(--card-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.4rem;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .question-btn:hover {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portfolio Assistant</h1>
        <div class="chat-area">
            <div id="chat-box">
                <div class="bot-msg">Hello! I can answer questions about Aryan's resume. Please select a topic below.</div>
            </div>
            <div>
                <p class="questions-title">Click a question to get an answer:</p>
                <div class="question-buttons" id="qna-buttons">
                    <!-- Buttons will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const qnaData = [
                {
                    question: "What is his career objective?",
                    answer: "Aryan is a motivated 2nd-year BSc Data Science student seeking an internship to apply and expand his skills in web development, data visualization, and more. His long-term goal is to contribute to impactful innovations as a Data Scientist."
                },
                {
                    question: "Summarize his internship experience.",
                    answer: "Aryan has completed internships as a Web Developer at CodTech, CodSoft, and Prodigy Infotech; a Python Programmer at Oasis Infobyte, Cognifyz, and TechoHacks; a Cybersecurity Intern at CodeAlpha; a Machine Learning Intern at SkillCraft; and an Artificial Intelligence Intern at CodeClause."
                },
                {
                    question: "What are his technical skills?",
                    answer: "His technical skills include Web Development (Responsive design, Ecommerce sites), Data Science (Data cleaning, EDA), Languages (Python, HTML, CSS, JavaScript, SQL), and Libraries/Frameworks (Pandas, NumPy, Flask, Scikit-learn)."
                },
                {
                    question: "Tell me about a key project.",
                    answer: "He built a Full-Stack Data Visualization Dashboard using React.js and FastAPI. The project features dynamic charts and real-time updates with multi-level filters to help users explore data."
                },
                {
                    question: "What certifications has he earned?",
                    answer: "He has earned several job simulation certifications from Forage, including Software Engineering from JPMorgan, GenAI-Powered Data Analytics from Tata Group, and Data Analytics from Deloitte."
                },
                {
                    question: "What are his strengths?",
                    answer: "His key strengths are being a quick learner who is adaptable to new technologies, being detail-oriented with creative thinking, and possessing strong communication and collaboration skills."
                }
            ];

            const buttonsContainer = document.getElementById('qna-buttons');
            const chatBox = document.getElementById('chat-box');

            function addMessageToChatbox(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = sender === 'user' ? 'user-msg' : 'bot-msg';
                messageDiv.textContent = text;
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            qnaData.forEach(item => {
                const button = document.createElement('button');
                button.className = 'question-btn';
                button.textContent = item.question;
                button.onclick = () => {
                    // Add user's "question" to the chat
                    addMessageToChatbox(item.question, 'user');
                    // Add bot's answer to the chat after a short delay
                    setTimeout(() => {
                        addMessageToChatbox(item.answer, 'bot');
                    }, 500); // 0.5 second delay to simulate thinking
                };
                buttonsContainer.appendChild(button);
            });
        });
    </script>
</body>
</html>
